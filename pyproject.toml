[project]
name = "repairhub"
version = "0.1.0"
description = "Verwaltung privater Reparaturfälle für Haushaltsgeräte und Elektronik"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Pillow==12.3.0",
    "boto3==1.43.99",
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "SQLAlchemy==2.0.54",
    "argon2-cffi==25.1.0",
    "bleach==6.4.0",
    "email-validator==2.3.0",
    "flask-babel==4.0.0",
    "flask-mailman==1.1.1",
    "flask-security==5.8.2",
    "gunicorn==26.2.0",
    "itsdangerous==2.2.0",
    "psycopg[binary]==3.3.6",
    "reportlab==5.0.1",
]

[dependency-groups]
ci = [
    "ansible-core==2.21.4",
    "ansible-lint==26.8.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]
dev = [
    "aiosmtpd==1.4.6",
    "pypdf==6.19.0",
    "pytest==9.1.1",
    "ruff==0.16.8",
]
e2e = [
    "playwright==1.63.0",
]

[tool.uv]
# Deployment-Anwendung, kein auf PyPI zu veröffentlichendes Paket.
package = false
required-version = "==0.12.16"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: einzelne Funktion oder Komponente ohne externe Dienste",
    "integration: Zusammenspiel von Komponenten, PostgreSQL oder echten Prozessen",
    "e2e: Chromium gegen die gebaute Anwendung mit Nginx, Gunicorn und PostgreSQL",
]
