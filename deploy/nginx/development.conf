user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    # Bestätigungs- und Reset-Tokens sind Zugangsnachweise und gehören nicht ins Log.
    map $uri $safe_uri {
        default $uri;
        ~^/confirm/ /confirm/[redacted];
        ~^/reset/ /reset/[redacted];
    }
    log_format minimal '$remote_addr $request_method $safe_uri $status';
    access_log /dev/stdout minimal;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        # Dieselbe Inhalts- und Frame-Policy auch bei lokaler HTTP-Entwicklung prüfen.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
        location /static/ {
            # Lokale Module nach Änderungen revalidieren; Header-Vererbung erhalten.
            expires -1;
            root /usr/share/nginx/html;
            try_files $uri =404;
        }
        location / {
            set $upstream app:8000;
            proxy_pass http://$upstream;
            # Nichtstandardports für Flask-WTFs Referer-Prüfung erhalten.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Port '';
            proxy_set_header X-Forwarded-Prefix '';
        }
    }
}
