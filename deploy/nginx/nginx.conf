user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    # Keine Querystrings, Authorization-Header oder Request-Bodies protokollieren.
    # Bestätigungs- und Reset-Tokens sind Zugangsnachweise und gehören nicht ins Log.
    map $uri $safe_uri {
        default $uri;
        ~^/confirm/ /confirm/[redacted];
        ~^/reset/ /reset/[redacted];
    }
    log_format minimal '$remote_addr $request_method $safe_uri $status';
    access_log /dev/stdout minimal;
    server_tokens off;
    sendfile on;
    client_max_body_size 11m;
    # Docker-DNS erneut abfragen, wenn das Anwendungsimage ersetzt wird.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # Stylesheets und JavaScript ausschliesslich von eigener Origin; Einbettung in Frames verhindern.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;

        location /static/ {
            root /usr/share/nginx/html/current;
            try_files $uri =404;
        }

        location / {
            set $upstream app:8000;
            proxy_pass http://$upstream;
            # Nichtstandardports für Flask-WTFs Referer-Prüfung erhalten.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Port '';
            proxy_set_header X-Forwarded-Prefix '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
