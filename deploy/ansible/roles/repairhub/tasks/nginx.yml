---
- name: Nginx ausschliesslich bei Erstinstallation oder Wartung bereitstellen
  community.docker.docker_compose_v2:
    project_src: "{{ repairhub_infrastructure_dir }}"
    project_name: "{{ repairhub_project_name }}"
    files: [compose.yaml, compose.production.yaml]
    services: [nginx]
    dependencies: false
    state: present
    build: never
    pull: never
    wait: true
    wait_timeout: "{{ repairhub_wait_timeout }}"
  no_log: true

- name: Geänderte Nginx- und TLS-Konfiguration vor dem Neuladen validieren
  community.docker.docker_compose_v2_exec:
    project_src: "{{ repairhub_infrastructure_dir }}"
    project_name: "{{ repairhub_project_name }}"
    files: [compose.yaml, compose.production.yaml]
    service: nginx
    argv: [nginx, -t, -c, /etc/nginx/repairhub/nginx.conf]
  changed_when: false
  when: repairhub_nginx_config.changed or repairhub_infrastructure_secrets.changed
  no_log: true

- name: Ausschliesslich ausdrücklich geänderte Nginx-Konfiguration neu laden
  community.docker.docker_compose_v2_exec:
    project_src: "{{ repairhub_infrastructure_dir }}"
    project_name: "{{ repairhub_project_name }}"
    files: [compose.yaml, compose.production.yaml]
    service: nginx
    argv: [nginx, -s, reload, -c, /etc/nginx/repairhub/nginx.conf]
  when: repairhub_previous | length > 0 and (repairhub_nginx_config.changed or repairhub_infrastructure_secrets.changed)
  changed_when: true
  no_log: true

# Nach Erststart/Wartung verwendet der geprüfte Nginx diese Generation bereits.
# Ohne diesen Marker würde der nächste identische Release unnötig nachladen.
- name: Durch Nginx erfolgreich aktivierte Zertifikatsgeneration vermerken
  ansible.builtin.copy:
    dest: "{{ repairhub_infrastructure_dir }}/tls/.loaded-fingerprint"
    content: "{{ repairhub_acme_current.stat.lnk_target }}"
    mode: "0600"
  when: repairhub_tls_mode == 'acme'
