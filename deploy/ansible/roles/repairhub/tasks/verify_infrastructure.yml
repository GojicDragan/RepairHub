---
- name: Verwaltete Infrastrukturdateien ohne Geheimnisausgabe prüfen
  ansible.builtin.stat:
    path: "{{ repairhub_infrastructure_dir }}/{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - path: compose.yaml
      content: "{{ lookup('ansible.builtin.file', repairhub_repo_root + '/compose.yaml', rstrip=false) }}"
    - path: compose.production.yaml
      content: "{{ lookup('ansible.builtin.file', repairhub_repo_root + '/compose.production.yaml', rstrip=false) }}"
    - path: nginx/nginx.conf
      content: "{{ lookup('ansible.builtin.file', repairhub_repo_root + '/deploy/nginx/nginx.conf', rstrip=false) }}"
    - path: database.env
      content: "{{ repairhub_database_env }}"
    - path: tls/server.crt
      content: "{{ repairhub_tls_certificate }}"
    - path: tls/server.key
      content: "{{ repairhub_tls_private_key }}"
  when: item.path not in ['tls/server.crt', 'tls/server.key'] or repairhub_tls_mode == 'provided'
  register: repairhub_infrastructure_files
  no_log: true

- name: Abweichungen der bestehenden Infrastruktur vor einem App-Release abweisen
  ansible.builtin.assert:
    that:
      - item.stat.checksum | default('') == item.item.content | hash('sha256')
    fail_msg: Die Infrastrukturdateien weichen vom freigegebenen Stand ab; infrastructure.yml zur kontrollierten Korrektur verwenden.
  loop: "{{ repairhub_infrastructure_files.results }}"
  when: not item.skipped | default(false)
  no_log: true

- name: Bestehende Infrastrukturcontainer bestimmen
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ repairhub_project_name }}"
      - -f
      - compose.yaml
      - -f
      - compose.production.yaml
      - ps
      - --all
      - --quiet
      - "{{ item }}"
    chdir: "{{ repairhub_infrastructure_dir }}"
  loop: [db, nginx]
  register: repairhub_infrastructure_containers
  changed_when: false

- name: Tatsächliche Infrastruktur-Digests und Bereitschaft lesen
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ "{{.Config.Image}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}" }}'
      - "{{ item.stdout }}"
  loop: "{{ repairhub_infrastructure_containers.results }}"
  register: repairhub_infrastructure_running
  changed_when: false

# Nginx-Healthcheck prüft die Anwendung mit. Eine defekte Anwendung muss durch
# ein neues App-Release reparierbar bleiben; Nginx muss dafür lediglich laufen.
- name: Freigegebene laufende Infrastruktur vor App-Änderungen verlangen
  ansible.builtin.assert:
    that:
      - repairhub_infrastructure_running.results[0].stdout == repairhub_infrastructure.postgres_image + ' running healthy'
      - repairhub_infrastructure_running.results[1].stdout.split()[:2] == [repairhub_infrastructure.nginx_image, 'running']
    fail_msg: Nginx läuft nicht, PostgreSQL ist nicht bereit oder ein Infrastruktur-Digest weicht ab; zuerst infrastructure.yml ausführen.
