---
all:
  children:
    repairhub:
      hosts:
        production_target:
          ansible_host: "{{ lookup('ansible.builtin.env', 'REPAIRHUB_DEPLOY_HOST') }}"
          ansible_port: "{{ lookup('ansible.builtin.env', 'REPAIRHUB_DEPLOY_PORT') | default('22', true) | int }}"
          ansible_user: >-
            {{ lookup('ansible.builtin.env', 'REPAIRHUB_DEPLOY_USER')
               | default(undef('REPAIRHUB_DEPLOY_USER muss gesetzt sein.'), true) }}
          repairhub_environment: production
          repairhub_project_name: repairhub-production
